version: 2

before:
  hooks:
    - go mod tidy
    - go install github.com/tc-hib/go-winres@latest
    - go generate ./...

release:
  # 自动检测是否为预发布版本
  prerelease: auto

# 变更日志配置
changelog:
  # 排序方式：asc (旧->新) 或 desc (新->旧)
  sort: asc
  # 使用 github 自动链接 issue 和处理贡献者
  use: github
  # 过滤掉不需要显示在日志中的提交
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^Merge pull request"
      - "^Merge branch"
      - "go mod tidy"
  # 格式
  format: "{{.SHA}}: {{.Message}}"
  # 提交分组配置
  groups:
    - title: "✨ 新功能"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "🐛 Bug 修复"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "🚀 性能优化"
      regexp: "^.*perf[(\\w)]*:+.*$"
      order: 2
    - title: "🔧 维护与重构"
      regexp: "^.*(chore|refactor|build|ci)[(\\w)]*:+.*$"
      order: 3
    - title: "📝 文档"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 4
    - title: "其他"
      order: 999

# 构建配置（【已修改】彻底精简，仅保留 Windows amd64 编译目标）
builds:
  - id: subs-check
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc,jsonv2
    targets:
      - windows_amd64   # 常见的 64位 Windows 电脑 (Intel/AMD)
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }} -X main.CurrentCommit={{ .ShortCommit }}

# 归档配置（【已修改】修复了模板缺失 end 导致的报错，且格式直接锁定为 zip）
archives:
  - id: subs-check      # 新版本推荐用单数 id
    builds:
      - subs-check
    formats:
      - zip             # 因为只要 Windows，默认全用 zip 格式，不再需要 format_overrides
    # 修复了旧配置缺少 {{ end }} 且使用折叠换行引发的报错，直接生成标准包名
    name_template: "{{ .ProjectName }}_{{ title .Os }}_x86_64"
